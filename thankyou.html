<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cảm ơn bạn đã đăng ký!</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      background-color: #0F3528;
      color: #FFF9E6;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .container {
      max-width: 500px;
      padding: 40px;
      background: #1D4A34;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      border: 1px solid #284139;
    }
    .icon {
      width: 80px;
      height: 80px;
      background: #F8D794;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
    }
    .icon svg {
      width: 40px;
      height: 40px;
      color: #B86830;
    }
    h1 {
      font-size: 28px;
      margin-bottom: 16px;
      color: #F8D794;
    }
    p {
      font-size: 16px;
      line-height: 1.6;
      color: #809076;
      margin-bottom: 32px;
    }
    .btn-home {
      display: inline-block;
      padding: 14px 28px;
      background: #B86830;
      color: #FFF9E6;
      text-decoration: none;
      font-weight: 600;
      border-radius: 8px;
      transition: all 0.3s ease;
    }
    .btn-home:hover {
      background: #F8D794;
      color: #0F3528;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"></path>
      </svg>
    </div>
    <h1>Thanh toán thành công!</h1>
    <p>Tuyệt vời! Ý đã nhận được phí giữ chỗ của bạn. Hệ thống đang thiết lập hồ sơ và Ý sẽ liên hệ trực tiếp với bạn qua Zalo/Điện thoại trong vòng 24h tới để chốt lịch Buổi 1.</p>
    <a href="index.html" class="btn-home">Quay lại trang chủ</a>
  </div>
</body>
</html>
